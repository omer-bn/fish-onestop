<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belmaker Lab Fish Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{font-family:system-ui,Arial;margin:0;background:#f3f7fa;color:#123}header{background:#0b4f6c;color:#fff;padding:12px 16px}nav button{margin:4px;padding:6px 12px;border:0;border-radius:6px;cursor:pointer}nav button.on{background:#ffd166}
main{padding:12px}.note{background:#fff3cd;padding:8px 12px;border-radius:6px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#fff;border-radius:8px;padding:8px;box-shadow:0 1px 3px #0002}.card img{width:100%;height:130px;object-fit:cover;border-radius:6px;background:#dde}.lat{font-style:italic;color:#567;direction:ltr}
table{border-collapse:collapse;width:100%;background:#fff}td,th{border:1px solid #ccd;padding:4px 6px;font-size:14px}#map{height:420px;margin-bottom:10px}
#gate{position:fixed;inset:0;background:#0b4f6c;display:flex;align-items:center;justify-content:center;z-index:9999}#gate div{background:#fff;padding:24px;border-radius:10px;text-align:center}input{padding:6px}</style></head><body>
<div id="gate"><div><h2 data-t="gateT"></h2><input id="pw" type="password"> <button id="go" data-t="enter"></button><p id="err" style="color:#c00"></p></div></div>
<header><b data-t="title"></b> <button id="lang" style="float:inline-end"></button>
<nav><button data-v="species" class="on" data-t="species"></button><button data-v="sites" data-t="sites"></button><button data-v="obs" data-t="obs"></button></nav></header>
<main><div class="note" data-t="note"></div><div id="view"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const HASH="__HASH__";
const T={en:{gateT:"Enter the guide",pw:"Password",enter:"Enter",bad:"Wrong password",title:"Belmaker Lab Fish Guide",species:"Species",sites:"Sites",obs:"Observations & atlas",note:"Static view-only version: sign-up/login, new observation reports, photo uploads and automatic fish ID are not available here.",search:"Search (English/Hebrew/Latin)",allSeas:"All seas",red:"Red Sea",med:"Mediterranean",nSp:"species",noImg:"No image",site:"Site",sea:"Sea",nObs:"observations",nDives:"dives",date:"Date",sp:"Species",cnt:"Count",depth:"Depth",observer:"Observer",other:"עברית"},
he:{gateT:"כניסה למדריך",pw:"סיסמה",enter:"כניסה",bad:"סיסמה שגויה",title:"מדריך דגי מעבדת בלמקר",species:"מינים",sites:"אתרים",obs:"תצפיות ואטלס",note:"גרסה סטטית לצפייה בלבד: הרשמה/התחברות, דיווח תצפיות חדשות, העלאת תמונות וזיהוי אוטומטי של דגים אינם זמינים בגרסה זו.",search:"חיפוש (עברית/English/Latin)",allSeas:"כל הימים",red:"ים סוף",med:"ים תיכון",nSp:"מינים",noImg:"אין תמונה",site:"אתר",sea:"ים",nObs:"תצפיות",nDives:"צלילות",date:"תאריך",sp:"מין",cnt:"כמות",depth:"עומק",observer:"צופה",other:"English"}};
let LANG=localStorage.getItem("fishLang")||"en",CUR="species";const t=k=>T[LANG][k];
const nm=(o,k="")=>LANG==="en"?(o[k+(k?"English":"english")]||o[k+(k?"Hebrew":"hebrew")]||o.latin||""):(o[k+(k?"Hebrew":"hebrew")]||o[k+(k?"English":"english")]||o.latin||"");
const seaN=s=>s==="red"?t("red"):t("med");
function applyLang(){const h=document.documentElement;h.lang=LANG;h.dir=LANG==="he"?"rtl":"ltr";document.title=t("title");document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));const pw=document.getElementById("pw");if(pw)pw.placeholder=t("pw");document.getElementById("lang").textContent=t("other")}
document.getElementById("lang").onclick=()=>{LANG=LANG==="en"?"he":"en";localStorage.setItem("fishLang",LANG);applyLang();if(D.c)show(CUR)};
applyLang();
async function sha(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function unlock(){document.getElementById("gate").remove();start()}
if(localStorage.getItem("fishGate")===HASH)unlock();
async function tryPw(){if(await sha(document.getElementById("pw").value.trim())===HASH){localStorage.setItem("fishGate",HASH);unlock()}else document.getElementById("err").textContent=t("bad")}
if(document.getElementById("go")){document.getElementById("go").onclick=tryPw;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")tryPw()}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D={};
async function start(){const [c,s,o]=await Promise.all(["catalog","sites","observations"].map(n=>fetch("data/"+n+".json").then(r=>r.json())));D={c,s:s.sites,o};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");show(b.dataset.v)});show("species")}
function map(){const m=L.map("map").setView([31,34.8],7);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(m);return m}
function show(v){CUR=v;const el=document.getElementById("view");
if(v==="species"){el.innerHTML=`<input id="q" placeholder="${t("search")}" style="width:260px"> <select id="sea"><option value="">${t("allSeas")}</option><option value="red">${t("red")}</option><option value="mediterranean">${t("med")}</option></select> <span id="n"></span><div class="grid" id="g"></div>`;
const draw=()=>{const q=document.getElementById("q").value.toLowerCase(),sea=document.getElementById("sea").value;
const R=D.c.species.filter(s=>(!sea||s.sea===sea)&&[s.hebrew,s.english,s.latin,s.family&&s.family.hebrew,s.family&&s.family.english].join(" ").toLowerCase().includes(q));
document.getElementById("n").textContent=R.length+" "+t("nSp");
document.getElementById("g").innerHTML=R.map(s=>{const a=LANG==="en"?s.english:s.hebrew,b=LANG==="en"?s.hebrew:s.english;return `<div class="card">${s.image?`<img loading="lazy" src="${esc(s.image)}">`:`<div style="height:130px;background:#dde;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#678">${t("noImg")}</div>`}<b>${esc(a||s.latin)}</b><div>${esc(a?b:(b||""))}</div><div class="lat">${esc(s.latin)}</div><small>${esc(seaN(s.sea))} · ${esc(s.family?nm(s.family):"")}</small></div>`}).join("")};
document.getElementById("q").oninput=draw;document.getElementById("sea").onchange=draw;draw()}
if(v==="sites"){el.innerHTML=`<div id="map"></div><table><tr><th>${t("site")}</th><th>${LANG==="en"?"עברית":"Site"}</th><th>${t("sea")}</th></tr>`+D.s.map(s=>`<tr><td>${esc(nm(s))}</td><td>${esc(LANG==="en"?s.hebrew:s.english)}</td><td>${seaN(s.sea)}</td></tr>`).join("")+'</table>';
const m=map();D.s.forEach(s=>L.marker([s.lat,s.lng]).addTo(m).bindPopup(esc(nm(s))))}
if(v==="obs"){const S=D.o.sightings;el.innerHTML=`<div id="map"></div><h3>${S.length} ${t("nObs")} · ${D.o.dives.length} ${t("nDives")}</h3><table><tr><th>${t("date")}</th><th>${t("sp")}</th><th>${t("site")}</th><th>${t("cnt")}</th><th>${t("depth")}</th><th>${t("observer")}</th></tr>`+S.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(nm(r))} <span class="lat">${esc(r.latin)}</span></td><td>${esc(nm(r,"site"))}</td><td>${esc(r.count)}</td><td>${esc(r.depthM)}</td><td>${esc(r.observer)}</td></tr>`).join("")+"</table>";
const m=map();const g={};S.forEach(r=>{(g[r.siteId]=g[r.siteId]||{r,l:[]}).l.push(r)});Object.values(g).forEach(({r,l})=>L.circleMarker([r.lat,r.lng],{radius:6+Math.min(l.length,20)}).addTo(m).bindPopup(`<b>${esc(nm(r,"site"))}</b><br>`+l.map(x=>esc(nm(x))+" ×"+esc(x.count)).join("<br>")))}}
</script></body></html>
