<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belmaker Lab Fish Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--deep:#06314a;--sea:#0b6e99;--foam:#e8f4f8;--sun:#ffd166;--ink:#12303f}
*{box-sizing:border-box}body{font-family:"Segoe UI",system-ui,Arial,sans-serif;margin:0;background:var(--foam);color:var(--ink)}
header{background:linear-gradient(90deg,var(--deep),var(--sea));color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px #0003}
header b{font-size:18px;margin-inline-end:auto}nav{display:flex;flex-wrap:wrap;gap:4px}
nav button,#lang{padding:7px 14px;border:0;border-radius:20px;cursor:pointer;background:#ffffff22;color:#fff;font-size:14px}nav button.on{background:var(--sun);color:var(--deep);font-weight:600}#lang{border:1px solid #fff6;background:none}
main{padding:20px;max-width:1200px;margin:auto}.note{background:#fff8e1;border-inline-start:4px solid var(--sun);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 6px #0b4f6c1f;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px #0b4f6c33}
.card[data-open]{cursor:pointer;text-align:start;width:100%}
.card img,.ph{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#dde}.lat{font-style:italic;color:#567;direction:ltr}.card small{color:#678}
.ph{display:flex;align-items:center;justify-content:center;color:#678}
.divider{grid-column:1/-1;margin:18px 0 4px;padding-top:12px;border-top:2px dashed #b9d4df;color:#567;font-weight:600}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px #0b4f6c1f}td,th{padding:8px 10px;font-size:14px;border-bottom:1px solid #e3edf1;text-align:start}th{background:#d6eaf2}
.table-wrap{overflow-x:auto}
#map{height:420px;margin-bottom:8px;border-radius:12px;box-shadow:0 2px 6px #0b4f6c33;direction:ltr}
input,select{padding:8px 12px;border:1px solid #b9d4df;border-radius:20px;font-size:14px}
.hero{background:linear-gradient(160deg,var(--deep),var(--sea) 60%,#2fa3c7);color:#fff;border-radius:18px;padding:48px 32px;position:relative;overflow:hidden}
.hero h1{font-size:38px;margin:0 0 10px}.hero p{font-size:18px;max-width:640px;line-height:1.6;opacity:.95}.hero:after{content:"🐠 🐟 🐡";position:absolute;inset-inline-end:28px;bottom:14px;font-size:48px;opacity:.35}
.cta{margin-top:16px;padding:11px 22px;border:0;border-radius:24px;background:var(--sun);color:var(--deep);font-weight:700;font-size:16px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:22px 0}.stat{background:#fff;border-radius:14px;padding:18px;text-align:center;box-shadow:0 2px 6px #0b4f6c1f}.stat b{display:block;font-size:32px;color:var(--sea)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.feat .card{padding:20px;cursor:pointer}.feat h3{margin:6px 0}.feat .ic{font-size:30px}
.src{margin-top:24px;font-size:14px;color:#456;line-height:1.6}
#gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--deep),var(--sea));display:flex;align-items:center;justify-content:center;z-index:9999}#gate div{background:#fff;padding:32px;border-radius:16px;text-align:center;box-shadow:0 10px 30px #0005}
button#go{padding:8px 18px;border:0;border-radius:20px;background:var(--sea);color:#fff;cursor:pointer}
.back{min-height:44px;padding:8px 0;background:none;border:0;color:var(--sea);font-weight:700;font-size:16px;cursor:pointer}
button.link{background:none;border:0;padding:0;color:var(--sea);font:inherit;font-weight:700;cursor:pointer;text-align:start}
.detail-head{display:flex;gap:16px;align-items:flex-start;margin:4px 0 16px}
.detail-head img,.detail-head .ph{width:220px;height:160px;flex:none}
.detail-head h1{margin:0 0 6px;font-size:32px;line-height:1.15}
.hint{color:#456;font-size:14px;line-height:1.45;margin:8px 0 16px}
.rec{background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 6px #0b4f6c1f}
.rec h3{margin:0 0 4px;font-size:16px}.rec p{margin:2px 0;color:#456;font-size:14px}
.empty{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 6px #0b4f6c1f}
.freq-wrap{overflow-x:auto;background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 6px #0b4f6c1f}
.freq{display:grid;grid-template-columns:repeat(12,minmax(22px,1fr));gap:4px;align-items:end;min-height:140px}
.freq-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.freq-bar{width:100%;background:var(--sea);border-radius:4px 4px 0 0;min-height:2px}
.freq-col span,.freq-col b{font-size:11px;font-weight:650;color:#456}
.freq-col b{color:var(--deep)}
button:focus-visible,a:focus-visible,.card[data-open]:focus-visible{outline:3px solid rgba(11,110,153,.45);outline-offset:2px}
@media (max-width:700px){
  header{padding:10px 12px}header b{font-size:16px}nav button,#lang{padding:8px 10px}
  main{padding:12px}
  .hero{padding:28px 16px}.hero h1{font-size:28px}.hero p{font-size:16px}.hero:after{display:none}
  #map{height:300px}
  .detail-head{display:block}
  .detail-head img,.detail-head .ph{width:100%;height:180px}
  .detail-head h1{font-size:26px;margin-top:10px}
  .searchbar input{width:100%;margin-bottom:8px}
}
</style></head><body>
<div id="gate"><div><h2 data-t="gateT"></h2><input id="pw" type="password"> <button id="go" data-t="enter"></button><p id="err" style="color:#c00"></p></div></div>
<header><b data-t="title"></b> <button id="lang" style="float:inline-end"></button>
<nav><button data-v="home" class="on" data-t="home"></button><button data-v="species" data-t="species"></button><button data-v="sites" data-t="sites"></button><button data-v="obs" data-t="obs"></button></nav></header>
<main><div class="note" id="note" data-t="note"></div><div id="view"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="species.js"></script>
<script>
const HASH="01f3b57c1a3cadf3cb2c516015e7ed7a1191f884771ff5d7cab13499b28587e5";
const T={en:{home:"Home",heroT:"Fish of Israel's seas, at a glance",heroP:"A field identification guide from the Belmaker Lab for divers, students and researchers. It brings together the lab's Red Sea and Mediterranean fish ID guides, the survey sites, and dive observations in one place.",start:"Explore species",fSp:"Browse and search every species by English, Hebrew or Latin name, filtered by sea.",fSi:"See the lab's survey sites on an interactive map.",fOb:"View recorded sightings and dives on the atlas map.",sPh:"with photos",srcT:"Sources",noImgSec:"Species without a photo yet",gateT:"Enter the guide",pw:"Password",enter:"Enter",bad:"Wrong password",title:"Belmaker Lab Fish Guide",species:"Species",sites:"Sites",obs:"Observations & atlas",note:"Static view-only version: sign-up/login, new observation reports, photo uploads and automatic fish ID are not available here.",search:"Search (English/Hebrew/Latin)",allSeas:"All seas",red:"Red Sea",med:"Mediterranean",nSp:"species",noImg:"No image",site:"Site",sea:"Sea",nObs:"observations",nDives:"dives",date:"Date",sp:"Species",cnt:"Count",depth:"Depth",observer:"Observer",other:"עברית",back:"Back",whereTitle:"Where it was recorded",whenTitle:"Latest field records",seasonTitle:"When these records fall in the year",noSightings:"No published field records for this species.",mapEmpty:"This map is centered on the species' sea. There is no field-record location to mark.",mapPartial:"Records without coordinates are listed below and are not marked on the map.",unlocated:"No coordinates, so this record is not on the map.",seasonInsufficient:"Not enough published field records to describe a seasonal pattern. A chart needs records from at least two different months. This is not a statement about the easiest season to see the fish.",seasonCaption:"Each bar is the number of published field records in that month. It is reporting frequency: a taller bar can simply mean more surveys were written down that month, not that the fish is easier to see.",exampleNote:"Example rows for this species remain on the observations atlas. They are not shown here as field records.",openSpecies:"Open species",sightingWord:"Sighting",catchWord:"Catch"},
he:{home:"בית",heroT:"דגי ימי ישראל, במבט אחד",heroP:"מדריך זיהוי שטח של מעבדת בלמקר לצוללים, סטודנטים וחוקרים. הוא מאגד במקום אחד את מדריכי הזיהוי של המעבדה לים סוף ולים התיכון, את אתרי הסקר ואת תצפיות הצלילה.",start:"לגלות מינים",fSp:"עיון וחיפוש בכל המינים לפי שם עברי, אנגלי או לטיני, עם סינון לפי ים.",fSi:"אתרי הסקר של המעבדה על מפה אינטראקטיבית.",fOb:"תצפיות וצלילות מתועדות על מפת האטלס.",sPh:"עם תמונות",srcT:"מקורות",noImgSec:"מינים שעדיין אין להם תמונה",gateT:"כניסה למדריך",pw:"סיסמה",enter:"כניסה",bad:"סיסמה שגויה",title:"מדריך דגי מעבדת בלמקר",species:"מינים",sites:"אתרים",obs:"תצפיות ואטלס",note:"גרסה סטטית לצפייה בלבד: הרשמה/התחברות, דיווח תצפיות חדשות, העלאת תמונות וזיהוי אוטומטי של דגים אינם זמינים בגרסה זו.",search:"חיפוש (עברית/English/Latin)",allSeas:"כל הימים",red:"ים סוף",med:"ים תיכון",nSp:"מינים",noImg:"אין תמונה",site:"אתר",sea:"ים",nObs:"תצפיות",nDives:"צלילות",date:"תאריך",sp:"מין",cnt:"כמות",depth:"עומק",observer:"צופה",other:"English",back:"חזרה",whereTitle:"איפה תועד",whenTitle:"רשומות שדה אחרונות",seasonTitle:"מתי הרשומות האלה נופלות בשנה",noSightings:"אין רשומות שדה שפורסמו למין הזה.",mapEmpty:"המפה ממורכזת על הים של המין. אין מיקום של רשומת שדה לסימון.",mapPartial:"רשומות בלי קואורדינטות מופיעות למטה ואינן מסומנות על המפה.",unlocated:"אין קואורדינטות, ולכן הרשומה הזו לא על המפה.",seasonInsufficient:"אין מספיק רשומות שדה שפורסמו כדי לתאר דפוס עונתי. תרשים דורש רשומות משני חודשים שונים לפחות. זה אינו מידע על העונה הקלה ביותר לראות את הדג.",seasonCaption:"כל עמודה היא מספר רשומות השדה שפורסמו באותו חודש. זו תדירות דיווח: עמודה גבוהה יותר יכולה רק להעיד שנכתבו יותר סקרים באותו חודש, לא שהדג קל יותר לראייה.",exampleNote:"שורות דוגמה למין הזה נשארות באטלס התצפיות. הן לא מוצגות כאן כרשומות שדה.",openSpecies:"פתיחת המין",sightingWord:"תצפית",catchWord:"שלל"}};
let LANG=localStorage.getItem("fishLang")||"en",CUR="home",DETAIL=null,liveMap=null;
const t=k=>T[LANG][k]||k;
const nm=(o,k="")=>LANG==="en"?(o[k+(k?"English":"english")]||o[k+(k?"Hebrew":"hebrew")]||o.latin||""):(o[k+(k?"Hebrew":"hebrew")]||o[k+(k?"English":"english")]||o.latin||"");
const seaN=s=>s==="red"?t("red"):s==="mediterranean"?t("med"):"";
function applyLang(){const h=document.documentElement;h.lang=LANG;h.dir=LANG==="he"?"rtl":"ltr";document.title=t("title");document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));const pw=document.getElementById("pw");if(pw)pw.placeholder=t("pw");document.getElementById("lang").textContent=t("other")}
document.getElementById("lang").onclick=()=>{LANG=LANG==="en"?"he":"en";localStorage.setItem("fishLang",LANG);applyLang();if(D.c)route()};
applyLang();
async function sha(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function unlock(){document.getElementById("gate").remove();start()}
if(localStorage.getItem("fishGate")===HASH)unlock();
async function tryPw(){if(await sha(document.getElementById("pw").value.trim())===HASH){localStorage.setItem("fishGate",HASH);unlock()}else document.getElementById("err").textContent=t("bad")}
if(document.getElementById("go")){document.getElementById("go").onclick=tryPw;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")tryPw()}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeId=id=>/^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$/.test(id||"")?id:"";
let D={};
function markNav(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
async function start(){const [c,s,o]=await Promise.all(["catalog","sites","observations"].map(n=>fetch("data/"+n+".json").then(r=>r.json())));D={c,s:s.sites,o};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.v});
window.addEventListener("hashchange",route);route()}
function go(v){location.hash=v}
function destroyMap(){if(liveMap){liveMap.remove();liveMap=null}}
function map(){const m=L.map("map").setView([31,34.8],7);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(m);liveMap=m;return m}
function bindOpens(root){root.querySelectorAll("[data-open]").forEach(el=>{const open=()=>{const id=safeId(el.dataset.open);if(id)location.hash="species/"+id};el.addEventListener("click",open);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}})})}
function route(){if(!D.c)return;destroyMap();const hash=location.hash.replace(/^#/,"");const species=hash.match(/^species\/([A-Za-z0-9][A-Za-z0-9._-]{0,80})$/);
if(species){renderDetail(species[1]);return}
const view=["home","species","sites","obs"].includes(hash)?hash:"home";show(view)}
function show(v){CUR=v;DETAIL=null;markNav(v);const el=document.getElementById("view");document.getElementById("note").style.display=v==="home"?"none":"";
if(v==="home"){const sp=D.c.species,src=D.c.sources;el.innerHTML=`<section class="hero"><h1>${t("heroT")}</h1><p>${t("heroP")}</p><button class="cta" onclick="go('species')">${t("start")} →</button></section>
<div class="stats"><div class="stat"><b>${sp.length}</b>${t("nSp")}</div><div class="stat"><b>${sp.filter(s=>s.image).length}</b>${t("sPh")}</div><div class="stat"><b>${D.s.length}</b>${t("sites")}</div><div class="stat"><b>${D.o.sightings.length}</b>${t("nObs")}</div></div>
<div class="feat"><div class="card" onclick="go('species')"><div class="ic">🐠</div><h3>${t("species")}</h3>${t("fSp")}</div><div class="card" onclick="go('sites')"><div class="ic">📍</div><h3>${t("sites")}</h3>${t("fSi")}</div><div class="card" onclick="go('obs')"><div class="ic">🤿</div><h3>${t("obs")}</h3>${t("fOb")}</div></div>
<div class="src"><b>${t("srcT")}</b><br>${src.slides.map(esc).join("<br>")}<br>${esc(src.names)}<br>${esc(src.photographs)}</div>`;return}
if(v==="species"){el.innerHTML=`<div class="searchbar"><input id="q" placeholder="${t("search")}" style="width:min(100%,260px)"> <select id="sea"><option value="">${t("allSeas")}</option><option value="red">${t("red")}</option><option value="mediterranean">${t("med")}</option></select> <span id="n"></span></div><div class="grid" id="g"></div>`;
const draw=()=>{const q=document.getElementById("q").value.toLowerCase(),sea=document.getElementById("sea").value;
const R=D.c.species.slice().sort((a,b)=>(!a.image)-(!b.image)).filter(s=>(!sea||s.sea===sea)&&[s.hebrew,s.english,s.latin,s.family&&s.family.hebrew,s.family&&s.family.english].join(" ").toLowerCase().includes(q));
document.getElementById("n").textContent=R.length+" "+t("nSp");
const fi=R.findIndex(s=>!s.image);document.getElementById("g").innerHTML=R.map((s,i)=>{const dv=i===fi&&i>0?`<div class="divider">${t("noImgSec")}</div>`:"";const a=LANG==="en"?s.english:s.hebrew,b=LANG==="en"?s.hebrew:s.english;const id=safeId(s.id);return dv+`<article class="card" data-open="${esc(id)}" tabindex="0" role="button" aria-label="${esc(t("openSpecies")+" "+(a||s.latin))}">${s.image?`<img loading="lazy" alt="" src="${esc(s.image)}">`:`<div class="ph">${t("noImg")}</div>`}<b>${esc(a||s.latin)}</b><div>${esc(a?b:(b||""))}</div><div class="lat">${esc(s.latin)}</div><small>${esc(seaN(s.sea))} · ${esc(s.family?nm(s.family):"")}</small></article>`}).join("");bindOpens(document.getElementById("g"))};
document.getElementById("q").oninput=draw;document.getElementById("sea").onchange=draw;draw();return}
if(v==="sites"){el.innerHTML=`<div id="map"></div><div class="table-wrap"><table><tr><th>${t("site")}</th><th>${LANG==="en"?"עברית":"Site"}</th><th>${t("sea")}</th></tr>`+D.s.map(s=>`<tr><td>${esc(nm(s))}</td><td>${esc(LANG==="en"?s.hebrew:s.english)}</td><td>${seaN(s.sea)}</td></tr>`).join("")+"</table></div>";
const m=map();D.s.forEach(s=>{const c=SpeciesDetail.validCoord(s.lat,s.lng);if(c)L.marker(c).addTo(m).bindPopup(esc(nm(s)))});return}
if(v==="obs"){const S=D.o.sightings;el.innerHTML=`<div id="map"></div><h3>${S.length} ${t("nObs")} · ${D.o.dives.length} ${t("nDives")}</h3><div class="table-wrap"><table><tr><th>${t("date")}</th><th>${t("sp")}</th><th>${t("site")}</th><th>${t("cnt")}</th><th>${t("depth")}</th><th>${t("observer")}</th></tr>`+S.map(r=>`<tr><td>${esc(r.date)}</td><td><button type="button" class="link" data-open="${esc(safeId(r.speciesId))}">${esc(nm(r))}</button> <span class="lat">${esc(r.latin)}</span></td><td>${esc(nm(r,"site"))}</td><td>${esc(r.count)}</td><td>${esc(r.depthM)}</td><td>${esc(r.observer)}</td></tr>`).join("")+"</table></div>";
bindOpens(el);const m=map();const g={};S.forEach(r=>{const c=SpeciesDetail.validCoord(r.lat,r.lng);if(!c)return;(g[r.siteId]=g[r.siteId]||{r,l:[],c}).l.push(r)});Object.values(g).forEach(({r,l,c})=>L.circleMarker(c,{radius:6+Math.min(l.length,20)}).addTo(m).bindPopup(`<b>${esc(nm(r,"site"))}</b><br>`+l.map(x=>esc(nm(x))+" ×"+esc(x.count)).join("<br>")))}}
const METHOD={en:{snorkel:"Snorkel",scuba:"Scuba",transect:"Transect",fishing:"Fishing"},he:{snorkel:"שנורקל",scuba:"צלילה",transect:"טרנסקט",fishing:"דיג"}};
function methodLabel(value){if(!value)return "";return (METHOD[LANG]&&METHOD[LANG][value])||value}
function monthName(index){return new Intl.DateTimeFormat(LANG==="he"?"he-IL":"en-GB",{month:"short"}).format(new Date(Date.UTC(2020,index,15)))}
function renderDetail(id){const species=(D.c.species||[]).find(s=>s.id===id);CUR="detail";DETAIL=id;markNav("species");document.getElementById("note").style.display="";const el=document.getElementById("view");
if(!species){el.innerHTML=`<button type="button" class="back" id="back">${t("back")}</button><div class="empty"><p>${t("noSightings")}</p></div>`;document.getElementById("back").onclick=()=>{location.hash="species"};return}
const records=SpeciesDetail.fieldRecords(D.o.sightings,species.id);const placed=SpeciesDetail.markerGroups(records);const season=SpeciesDetail.seasonSummary(records);const examples=SpeciesDetail.hasExampleRows(D.o.sightings,species.id);
const primary=LANG==="en"?species.english:species.hebrew;const secondary=LANG==="en"?species.hebrew:species.english;
const head=`<div class="detail-head">${species.image?`<img alt="" src="${esc(species.image)}">`:`<div class="ph">${t("noImg")}</div>`}<div><h1>${esc(primary||species.latin)}</h1><div class="lat">${esc(species.latin)}</div><p>${esc([secondary,seaN(species.sea),species.family?nm(species.family):""].filter(Boolean).join(" · "))}</p>${species.description?`<p>${esc(species.description)}</p>`:""}</div></div>`;
const list=records.length?records.map(r=>{const bits=[nm(r,"site")||t("site")];if(r.count!=null&&r.count!=="")bits.push("×"+r.count);if(r.depthM!=null&&r.depthM!=="")bits.push(r.depthM+" m");if(r.method)bits.push(methodLabel(r.method));if(r.kind==="catch")bits.push(t("catchWord"));const where=SpeciesDetail.validCoord(r.lat,r.lng)?"":`<p>${t("unlocated")}</p>`;return `<article class="rec"><h3>${esc(SpeciesDetail.whenLabel(r,D.o.dives))}</h3><p>${esc(bits.filter(Boolean).join(" · "))}</p>${r.observer?`<p>${esc(t("observer")+": "+r.observer)}</p>`:""}${where}</article>`}).join(""):`<div class="empty"><p>${t("noSightings")}</p></div>`;
const seasonBody=season.enough?`<div class="freq-wrap"><div class="freq" role="img" aria-label="${esc(t("seasonCaption"))}">${season.months.map((n,i)=>{const max=Math.max.apply(null,season.months.concat(1));const h=Math.round(n/max*96);return `<div class="freq-col"><div class="freq-bar" style="height:${h}px"></div><b>${n}</b><span>${esc(monthName(i))}</span></div>`}).join("")}</div></div><p class="hint">${t("seasonCaption")}</p>`:`<div class="empty"><p>${t("seasonInsufficient")}</p></div>`;
const mapNote=placed.groups.length? (placed.unlocated.length?`<p class="hint">${t("mapPartial")}</p>`:""):`<p class="hint">${t("mapEmpty")}</p>`;
el.innerHTML=`<button type="button" class="back" id="back">${t("back")}</button>${head}<h2>${t("whereTitle")}</h2><div id="map"></div>${mapNote}${examples?`<p class="hint">${t("exampleNote")}</p>`:""}<h2>${t("whenTitle")}</h2>${list}<h2>${t("seasonTitle")}</h2>${seasonBody}`;
document.getElementById("back").onclick=()=>{location.hash="species"};
const m=map();const view=SpeciesDetail.seaView(species.sea);
if(!placed.groups.length)m.setView(view.center,view.zoom);
else if(placed.groups.length===1)m.setView([placed.groups[0].lat,placed.groups[0].lng],13);
else m.fitBounds(placed.groups.map(g=>[g.lat,g.lng]),{padding:[28,28]});
placed.groups.forEach(g=>{const lines=g.records.map(r=>esc(SpeciesDetail.whenLabel(r,D.o.dives))+" · "+esc(nm(r,"site"))).join("<br>");L.circleMarker([g.lat,g.lng],{radius:9,color:"#06314a",weight:2,fillColor:"#ffd166",fillOpacity:.95}).addTo(m).bindPopup(lines)});
setTimeout(()=>{if(liveMap)liveMap.invalidateSize()},0)}
</script></body></html>
